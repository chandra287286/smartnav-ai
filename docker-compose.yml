services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartnav-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartnav
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartnav"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartnav-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/smartnav
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173,https://localhost:5173
    ports:
      - "8000:8000"

volumes:
  postgis_data:
